# ===========================================================================
# KYC POLICY
# ===========================================================================
# Every threshold the KYC Agent applies lives here. None of them are written
# into the matching logic, so a credit policy change is a config change and is
# visible in review rather than buried in code.
#
# A check can be:
#   enabled  false -> the check is SKIPPED and contributes nothing
#   blocking false -> the check may still REVIEW/FAIL, but cannot by itself
#                     drive the overall verdict below REVIEW
#
# ---------------------------------------------------------------------------
# WHY ORDINARY IDENTITY MISMATCHES ARE NON-BLOCKING
# ---------------------------------------------------------------------------
# Documents disagreeing is NOT evidence of fraud, and this agent cannot tell
# the difference between the two things that actually cause it:
#
#   a genuine applicant  -- a married name, a corrected date of birth, an
#                           initial expanded, a transliteration, a stale
#                           address, a document issued years apart
#   a bad application    -- someone else's document in the bundle
#
# Only a human can. So a mismatch routes the case to one, and the finding is
# reported in full -- which documents, which field, what each of them said --
# rather than being converted into an automatic rejection nobody can appeal.
#
# THE BLOCKING MECHANISM IS DELIBERATELY KEPT. Setting blocking: true on a
# check restores its power to drive the overall verdict to FAIL, and a FAIL
# rolls up to decision REJECT. That is how a genuine business or risk rule is
# expressed. What changed is the DEFAULT for ordinary document-to-document
# disagreement, not the ability to define a blocking condition.
#
# The resulting policy, stated once and applied deterministically:
#
#   check FAILs, blocking: false  ->  overall REVIEW  ->  decision REVIEW
#                                                     ->  MANUAL_REVIEW
#   check FAILs, blocking: true   ->  overall FAIL    ->  decision REJECT
#
# The per-check status is NOT capped: a failed check still reports FAIL, with
# its reason codes, sources and the value each document carried. Only its
# effect on the overall verdict is bounded.
# ===========================================================================

policy_version: "1.0.0"
signed_off: false

# ---------------------------------------------------------------------------
# NAME
# ---------------------------------------------------------------------------
# Scores come from the deterministic matcher in app/services/name_match.py:
# exact 1.0, token-set 0.98, initials 0.95, otherwise character similarity.
name:
  enabled: true
  # Non-blocking: names legitimately differ across a person's documents.
  # A disagreement goes to a reviewer with both values attached.
  blocking: false
  # At or above this, two names are the same person.
  match_threshold: 0.85
  # Between review_threshold and match_threshold the answer is uncertain and
  # goes to a human rather than being decided either way.
  review_threshold: 0.70

# ---------------------------------------------------------------------------
# DATE OF BIRTH
# ---------------------------------------------------------------------------
# Compared exactly after normalisation. A date of birth does not have
# near-misses: two documents either agree or they disagree, and a disagreement
# is a hard stop. A MISSING date is never inferred from another document.
dob:
  enabled: true
  # Non-blocking. A date of birth has no near-misses -- two documents either
  # agree or they do not -- and a disagreement is still reported as a hard
  # FAIL on the check itself. What it no longer does is reject the applicant
  # without a human ever seeing it.
  blocking: false

# ---------------------------------------------------------------------------
# ADDRESS
# ---------------------------------------------------------------------------
# Compared component by component, not as raw strings: documents abbreviate
# and reorder address lines constantly, so string equality would fail almost
# every genuine applicant.
#
# Weights express how much each component says about "same address". A pincode
# agreeing is strong evidence; a city agreeing is weak, because most applicants
# in a batch share one.
address:
  enabled: true
  blocking: false
  pass_score: 0.80
  review_score: 0.55
  weights:
    pincode: 0.30
    house: 0.20
    street: 0.15
    locality: 0.15
    city: 0.12
    state: 0.08
  # Component strings at or above this similarity count as agreeing.
  component_threshold: 0.85

# ---------------------------------------------------------------------------
# PAN
# ---------------------------------------------------------------------------
# Format is validated with the same rule the Document Agent uses. Values are
# compared as read; nothing is repaired here beyond case and whitespace.
pan:
  enabled: true
  # Non-blocking. Two documents quoting different PANs is a serious finding
  # and is reported as FAIL with both values, but it is a reviewer's call --
  # a mistyped PAN on a payslip is not the same thing as a false identity.
  blocking: false

# ---------------------------------------------------------------------------
# INCOME
# ---------------------------------------------------------------------------
# Monthly figures are annualised before comparison.
#
# IMPORTANT: bank credits are NOT guaranteed salary. A statement's average
# monthly credit includes transfers, refunds and reimbursements, so it is
# expected to sit ABOVE declared salary. The comparison basis is reported on
# every result so a reviewer reads the number correctly.
income:
  enabled: true
  blocking: false
  months_per_year: 12
  # Percentage difference between two annualised figures, relative to the
  # larger of the two.
  pass_variance_pct: 25.0
  review_variance_pct: 50.0
  # Figures below this are treated as not meaningfully comparable rather than
  # producing enormous percentage differences on rounding noise.
  min_comparable_annual: 1000.0

# ---------------------------------------------------------------------------
# OVERALL DECISION
# ---------------------------------------------------------------------------
decision:
  # Fewer comparable sources than this and the result cannot be a PASS: there
  # was nothing to cross-check against.
  min_sources_for_pass: 2
